<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Loft - L'Isle-Adam</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f4ef;
      color: #222;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    a {
      display: block;
      padding: 17px 20px;
      border-radius: 14px;
      background: white;
      color: #222;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      transition: 0.2s;
    }

    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.12);
    }

    .footer {
      margin-top: 35px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Le Loft</h1>
    <p class="subtitle">L'Isle-Adam</p>

    <div class="buttons">

      <a href="https://www.google.com/" target="_blank">
        ⭐ Avis Google
      </a>

      <a href="#" target="_blank">
        📸 Instagram
      </a>

      <a href="#" target="_blank">
        📞 Nous contacter
      </a>

      <a href="#" target="_blank">
        🌐 Notre site
      </a>

    </div>

    <div class="footer">
      Propulsé par TapAndGo
    </div>

  </div>

</body>
</html>
